name: AIUsageIOS
options:
  bundleIdPrefix: com.drafff.aiusagewidget
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: S889TFV5A4
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  AIUsageIOS:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/UsageCore
        excludes:
          - WidgetData.swift
      - path: Sources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drafff.aiusagewidget.ios
        PRODUCT_NAME: Headroom
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Resources/App.entitlements
    dependencies:
      - target: AIUsageWidgetExtension
        embed: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Headroom
        CFBundleShortVersionString: "1.1.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  AIUsageWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ../Sources/UsageCore
        excludes:
          - WidgetData.swift
      - path: WidgetSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drafff.aiusagewidget.ios.widget
        PRODUCT_NAME: AIUsageWidgetExtension
        CODE_SIGN_ENTITLEMENTS: Resources/Widget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: Resources/WidgetInfo.plist
      properties:
        CFBundleDisplayName: Headroom
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "1.1.1"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
